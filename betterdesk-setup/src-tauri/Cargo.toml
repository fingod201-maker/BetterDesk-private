[package]
name = "betterdesk-setup"
version = "1.0.0"
edition = "2021"
description = "zoom-private Setup — one-click installer for the in-house BetterDesk client"
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "time"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "native-tls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
dirs = "5"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
