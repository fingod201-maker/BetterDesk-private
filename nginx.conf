# BetterDesk Production Nginx Reverse Proxy
# Domains:
#   zoom.telcom.stream  -> landing service (:8080)
#   panel.telcom.stream -> Node.js admin console (:5000)
#
# SSL termination via Let's Encrypt (certbot).
# All HTTP -> HTTPS redirect. HSTS enabled.
# Security headers applied globally.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  100000;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Buffer limits (anti-slowloris)
    client_body_buffer_size  128k;
    client_max_body_size     100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstreams (internal Docker network or localhost)
    upstream landing_backend {
        server landing-service:8080 fail_timeout=0s;
        keepalive 32;
    }

    upstream panel_backend {
        server betterdesk-console:5000 fail_timeout=0s;
        keepalive 128;
    }

    upstream go_api_backend {
        server betterdesk-server:21121 fail_timeout=0s;
        keepalive 128;
    }

    # ========================================================================
    # HTTP -> HTTPS redirect (all domains)
    # ========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    # zoom.telcom.stream — Public Landing Page
    # ========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name zoom.telcom.stream *.zoom.telcom.stream;

        # SSL certificates (managed by certbot)
        ssl_certificate     /etc/letsencrypt/live/zoom.telcom.stream/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zoom.telcom.stream/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/zoom.telcom.stream/chain.pem;

        include /etc/nginx/ssl-params.conf;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Landing page — proxied to landing service
        location / {
            proxy_pass http://landing_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets — direct (cached)
        location /img/ {
            proxy_pass http://landing_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /js/ {
            proxy_pass http://landing_backend;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Health check
        location /healthz {
            proxy_pass http://landing_backend/healthz;
            access_log off;
        }
    }

    # ========================================================================
    # panel.telcom.stream — Admin Web Console
    # ========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name panel.telcom.stream *.panel.telcom.stream;

        # SSL certificates (managed by certbot)
        ssl_certificate     /etc/letsencrypt/live/panel.telcom.stream/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panel.telcom.stream/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/panel.telcom.stream/chain.pem;

        include /etc/nginx/ssl-params.conf;

        # Security headers (stricter for admin panel)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:;" always;

        # ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Admin console — proxied to Node.js console
        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 50;

            proxy_pass http://panel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  // long for file uploads/terminal
            proxy_buffering off;

            # WebSocket upgrade (Socket.IO / real-time push)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;

            # CSRF / session cookies must pass through
            proxy_pass_header Set-Cookie;
            proxy_pass_header Set-Cookie2;
        }

        # Health check (internal monitoring)
        location /health {
            proxy_pass http://panel_backend/health;
            access_log off;
        }

        # RustDesk client API proxy (21121) — exposed via panel domain for WAN clients
        location /api/ {
            proxy_pass http://go_api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }

    # ========================================================================
    # Catch-all HTTPS server (unknown domains -> 444)
    # ========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/zoom.telcom.stream/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zoom.telcom.stream/privkey.pem;
        include /etc/nginx/ssl-params.conf;
        return 444;
    }
}
