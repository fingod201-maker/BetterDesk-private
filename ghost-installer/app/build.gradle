plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.android.shell.ghost'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = "com.android.shell.ghost"
        minSdk = 26
        targetSdk = 35
        versionCode = 123
        versionName = "2.1.123"
        resConfigs "en"
    }

    signingConfigs {
        release {
            storeFile = file("../release.keystore")
            storePassword = "GhostDropper2026!"
            keyAlias = "ghost"
            keyPassword = "GhostDropper2026!"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Chrome_WebView_v117.apk"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    // Hidden-API users (Shizuku newProcess / Binder internals) would otherwise
    // make a Play review fail; harmless for our sideloaded wrapper.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Bypass the non-SDK interface restriction so Shizuku's newProcess/Binder
    // internals resolve on Android 9+ (API 28+) regardless of the exemption list.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
