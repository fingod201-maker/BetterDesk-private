plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.shell.ghost'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.shell.ghost"
        minSdk 24
        targetSdk 34
        versionCode 114
        versionName "2.1.114"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}