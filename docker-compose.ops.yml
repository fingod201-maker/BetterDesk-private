# BetterDesk Operations Stack — 24/7 Production Infrastructure
# Domains: zoom.telcom.stream (landing) + panel.telcom.stream (admin console)
#
# Usage:
#   export CERTBOT_EMAIL=admin@telcom.stream
#   export RELAY_PUBLIC_IP=YOUR.PUBLIC.IP
#   docker compose -f docker-compose.ops.yml up -d
#
# Profiles:
#   (none)   — nginx + certbot + cadvisor + uptime-kuma (monitoring)
#   backup   — adds restic backup job

services:
  # ------------------------------------------------------------------
  # Nginx Reverse Proxy — SSL termination + domain routing
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: bd-nginx
    hostname: bd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx:rw
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
    networks:
      - bd-ops-net
    restart: unless-stopped
    depends_on:
      landing-service:
        condition: service_healthy
      betterdesk-console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------
  # Certbot — automatic Let's Encrypt issuance + renewal
  # ------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: bd-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt:rw
      - certbot-var:/var/lib/letsencrypt:rw
      - certbot-www:/var/www/certbot:rw
    command: certonly --webroot -w /var/www/certbot \
      --email "${CERTBOT_EMAIL:?CERTBOT_EMAIL must be set}" \
      --agree-tos --no-eff-email --keep-until-expiring \
      -d zoom.telcom.stream -d panel.telcom.stream
    restart: "no"
    profiles:
      - init

  certbot-renew:
    image: certbot/certbot:latest
    container_name: bd-certbot-renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --no-eff-email --post-hook \"nginx -s reload\"; sleep 12h & wait $${!}; done'"
    volumes:
      - certbot-etc:/etc/letsencrypt:rw
      - certbot-var:/var/lib/letsencrypt:rw
      - certbot-www:/var/www/certbot:rw
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - bd-ops-net

  # ------------------------------------------------------------------
  # Landing Service — zoom.telcom.stream backend (:8080)
  # ------------------------------------------------------------------
  landing-service:
    build:
      context: ./landing-service
      dockerfile: Dockerfile
    image: betterdesk-landing:local
    container_name: bd-landing
    hostname: bd-landing
    expose:
      - "8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - LANDING_ALLOWED_ORIGINS=https://zoom.telcom.stream,https://panel.telcom.stream
    volumes:
      - landing-data:/app/data
    networks:
      - bd-ops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------------
  # BetterDesk Console — panel.telcom.stream backend (:5000)
  # Uses existing Dockerfile.console + entrypoint (Go server + Node.js)
  # ------------------------------------------------------------------
  betterdesk-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: betterdesk-console:local
    container_name: bd-console
    hostname: bd-console
    expose:
      - "5000"
      - "21121"
    volumes:
      - bd-data:/opt/rustdesk
      - console-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - API_ENABLED=false
      - API_HOST=0.0.0.0
      - SERVER_BACKEND=betterdesk
      - HBBS_API_URL=http://127.0.0.1:21121/api
      - BETTERDESK_API_URL=http://127.0.0.1:21121/api
      - RUSTDESK_PATH=/opt/rustdesk
      - DATA_DIR=/app/data
      - DB_PATH=/opt/rustdesk/db_v2.sqlite3
      - PUB_KEY_PATH=/opt/rustdesk/id_ed25519.pub
      - API_KEY_PATH=/opt/rustdesk/.api_key
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (32+ chars)}
      - DB_TYPE=sqlite
      - DOCKER=true
      - ENCRYPTED_ONLY=1
      - RELAY_SERVERS=${RELAY_PUBLIC_IP:?RELAY_PUBLIC_IP must be set}
      - SIGNAL_RATE_LIMIT_PER_IP=20
      - ENROLLMENT_MODE=managed
      - NTP_SERVERS=pool.ntp.org,time.google.com,time.cloudflare.com
    networks:
      - bd-ops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:21121/api/health && curl -sf http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ------------------------------------------------------------------
  # cAdvisor — container metrics (for Prometheus / uptime-kuma)
  # ------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: bd-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - bd-ops-net
    restart: unless-stopped
    command: ["-housekeeping_interval=10s", "-docker_only=true"]

  # ------------------------------------------------------------------
  # Uptime Kuma — uptime monitoring + status page
  # ------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: bd-uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - bd-ops-net
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:
  bd-data:
  console-data:
  landing-data:
  uptime-kuma-data:

networks:
  bd-ops-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
