[package]
name = "betterdesk_flutter_android"
version = "1.5.0"
edition = "2021"
description = "BetterDesk Android client — Rust FFI bridge for the mobile remote desktop client"

[lib]
name = "betterdesk_flutter_android"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.7"
ndk-sys = "0.6"

[features]
default = []
hwcodec = []

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
