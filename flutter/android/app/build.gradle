buildscript {
    ext.flutterVersionCode = '104090003'
    ext.flutterVersionName = '1.5.0'
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '104090003'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.5.0'
}

android {
    namespace "com.carriez.flutter_hbb"
    compileSdkVersion 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.betterdesk.client"
        minSdkVersion 22
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword'] ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "default"
    productFlavors {
        arm64 {
            ndk {
                abiFilters 'arm64-v8a'
            }
            versionNameSuffix "-arm64"
            applicationIdSuffix ".arm64"
        }
        armeabi {
            ndk {
                abiFilters 'armeabi-v7a'
            }
            versionNameSuffix "-armeabi"
            applicationIdSuffix ".armeabi"
        }
        universal {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            versionNameSuffix "-universal"
            applicationIdSuffix ".universal"
        }
        x64 {
            ndk {
                abiFilters 'x86_64'
            }
            versionNameSuffix "-x64"
            applicationIdSuffix ".x64"
        }
    }

    // Set output file naming to follow zoom-private-<os>-<arch> pattern
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def originalName = output.outputFile.name
            def extension = originalName.substring(originalName.lastIndexOf('.') + 1)
            output.outputFileName = "zoom-private-android-${variant.flavorName}-${variant.versionName}.${extension}"
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs = ['src/main/jniLibs']
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media:media:1.6.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
}
