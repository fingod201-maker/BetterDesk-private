name: Windows Desktop Probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe interactive desktop
        shell: pwsh
        run: |
          query session
          query user
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Output "SCREEN=$($b.Width)x$($b.Height)"
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force C:\probe | Out-Null
          $bmp.Save('C:\probe\desktop-gdi.png',[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            ffmpeg -hide_banner -loglevel error -f gdigrab -frames:v 1 -i desktop -y C:\probe\desktop-ffmpeg.png
          }
          Get-ChildItem C:\probe | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-probe
          path: C:\probe\*
          if-no-files-found: warn
