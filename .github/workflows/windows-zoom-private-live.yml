name: Windows Zoom-Private Live
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Keep the Windows agent online for N seconds'
        required: false
        default: '18000'
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      DEVICE_ID: BD-LDU72LF2CEFK4
      SERVER_URL: ws://147.224.213.55:21122/cdap
      DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '18000' }}
      DEVICE_TOKEN: ${{ vars.WINDOWS_TEST_DEVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache-dependency-path: betterdesk-agent/go.sum
      - name: Ensure ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          ffmpeg -version | Select-Object -First 1
          Write-Output 'ffmpeg ready'
      - name: Build Windows agent
        working-directory: betterdesk-agent
        shell: pwsh
        env: { GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0' }
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = (Get-Content ..\VERSION -Raw).Trim()
          go build -trimpath -ldflags="-s -w -X main.version=$v" -o dist\betterdesk-agent.exe .
      - name: Run agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "::add-mask::$env:DEVICE_TOKEN"
          $cfgPath = Join-Path $env:TEMP 'bdagent-config.json'
          $logPath = Join-Path $env:TEMP 'bdagent.log'
          $cfg = @{
            server = $env:SERVER_URL
            auth_method = 'device_token'
            device_token = $env:DEVICE_TOKEN
            device_id = $env:DEVICE_ID
            device_name = 'windows-gha-live'
            device_type = 'os_agent'
            require_consent = $false
            terminal = $true
            file_browser = $true
            clipboard = $true
            screenshot = $true
            file_root = 'C:\'
            heartbeat_sec = 15
            reconnect_sec = 5
            max_reconnect = 300
            log_level = 'debug'
            data_dir = (Join-Path $env:TEMP 'bdagent-data')
            video_codec = 'mjpeg'
            hw_accel = 'none'
            enforce_tls = $false
          }
          $cfg | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 $cfgPath
          $exe = Join-Path $env:GITHUB_WORKSPACE 'betterdesk-agent\dist\betterdesk-agent.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('-config', $cfgPath) -RedirectStandardOutput $logPath -RedirectStandardError "$logPath.err" -PassThru
          $ok = $false
          for ($i=0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $logPath) -and (Select-String -Path $logPath -Pattern 'Connected as' -Quiet)) { $ok=$true; break }
            if ($p.HasExited) { break }
          }
          Get-Content $logPath -ErrorAction SilentlyContinue
          Get-Content "$logPath.err" -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Windows agent did not connect' }
          Start-Sleep -Seconds ([int]$env:DURATION_SECONDS)
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content $logPath -ErrorAction SilentlyContinue
          Get-Content "$logPath.err" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-zoom-private-live-logs
          path: |
            ${{ runner.temp }}/bdagent.log
            ${{ runner.temp }}/bdagent.log.err
          if-no-files-found: warn

