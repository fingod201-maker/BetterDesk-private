# =============================================================================
# BetterDesk — Agent Client Build (Tauri + Go sidecar)
# =============================================================================
# Builds the BetterDesk Agent desktop client (Tauri) for Windows, Linux, and
# macOS, cross-compiling the Go sidecar for each target.
#
# Artifacts per platform:
#   Windows: NSIS .exe + MSI + portable .exe
#   Linux:   .deb + .AppImage (+ .sig if signing secrets present)
#   macOS:   .dmg (+ notarized if signing secrets present)
#
# Runs on: push to main, release tags, workflow_dispatch
# =============================================================================

name: Build Agent Client (Windows / Linux / macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  AGENT_DIR: betterdesk-agent-client
  GO_AGENT_DIR: betterdesk-agent

jobs:
  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache: true

      - name: Build Go sidecar (windows-amd64)
        working-directory: ${{ env.GO_AGENT_DIR }}
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-x86_64-pc-windows-msvc.exe" -ldflags="-s -w" .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ env.AGENT_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.AGENT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: ${{ env.AGENT_DIR }}
        run: npm run build

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''
          cache: true

      - name: Install Protobuf Compiler
        shell: pwsh
        run: choco install protoc -y

      - name: Build Tauri (Windows)
        working-directory: ${{ env.AGENT_DIR }}
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: |
            ${{ env.AGENT_DIR }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ${{ env.AGENT_DIR }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux x64
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            protobuf-compiler \
            curl wget file

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache: true

      - name: Build Go sidecar (linux-amd64)
        working-directory: ${{ env.GO_AGENT_DIR }}
        run: |
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-x86_64-unknown-linux-gnu" -ldflags="-s -w" .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ env.AGENT_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.AGENT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: ${{ env.AGENT_DIR }}
        run: npm run build

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''
          cache: true

      - name: Build Tauri (Linux)
        working-directory: ${{ env.AGENT_DIR }}
        run: APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 npx tauri build --target x86_64-unknown-linux-gnu

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-x64
          path: |
            ${{ env.AGENT_DIR }}/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            ${{ env.AGENT_DIR }}/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            ${{ env.AGENT_DIR }}/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS (universal: arm64 + x64)
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache: true

      - name: Build Go sidecars (darwin-amd64 + darwin-arm64)
        working-directory: ${{ env.GO_AGENT_DIR }}
        run: |
          env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -o "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-x86_64-apple-darwin" -ldflags="-s -w" .
          env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -o "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-aarch64-apple-darwin" -ldflags="-s -w" .
          # Tauri's universal target looks for a single 'universal-apple-darwin' sidecar.
          lipo -create \
            "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-x86_64-apple-darwin" \
            "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-aarch64-apple-darwin" \
            -output "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-universal-apple-darwin"
          chmod +x "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-x86_64-apple-darwin" \
                   "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-aarch64-apple-darwin" \
                   "../${{ env.AGENT_DIR }}/src-tauri/binaries/betterdesk-agent-universal-apple-darwin"

      - name: Install Protobuf Compiler
        run: brew install protobuf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ env.AGENT_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.AGENT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: ${{ env.AGENT_DIR }}
        run: npm run build

      - name: Regenerate macOS .icns from PNGs
        working-directory: ${{ env.AGENT_DIR }}
        run: node scripts/gen-icns.mjs

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''
          cache: true

      - name: Ensure macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Tauri (macOS universal)
        working-directory: ${{ env.AGENT_DIR }}
        run: npx tauri build --target universal-apple-darwin

      - name: Rename macOS installer
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TARGET="src-tauri/target/universal-apple-darwin/release/bundle/dmg/zoom-private.agent_${VERSION}_universal.dmg"
          for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] || continue
            [ "$f" = "$TARGET" ] && continue
            mv "$f" "$TARGET"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-macos
          path: |
            ${{ env.AGENT_DIR }}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release — combine into GitHub Release
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-release

      - name: Generate checksums
        run: |
          find agent-release -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) | sort | while read f; do
            sha256sum "$f" >> agent-release/CHECKSUMS.sha256
          done
          cat agent-release/CHECKSUMS.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            agent-release/agent-windows-x64/*.exe
            agent-release/agent-windows-x64/*.msi
            agent-release/agent-linux-x64/*.deb
            agent-release/agent-linux-x64/*.AppImage
            agent-release/agent-macos/*.dmg
            agent-release/CHECKSUMS.sha256
