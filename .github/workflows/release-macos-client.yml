# =============================================================================
# BetterDesk macOS client - build, package (.tar.gz + .pkg), upload artifacts
# =============================================================================
# Builds the Go CDAP support agent for Intel (macos-13) and Apple Silicon
# (macos-14), then packages the macOS user-session installer and an unsigned
# .pkg. Trigger by tag push (macos-client-*) or manually from Actions.
# =============================================================================

name: Build macOS Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (defaults to VERSION file)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'macos-client-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache-dependency-path: betterdesk-agent/go.sum

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#macos-client-}"
          fi
          if [ -z "$V" ]; then
            V="$(tr -d '\r\n' < VERSION)"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Building macOS client version $V for ${{ matrix.arch }}"

      - name: Build agent
        working-directory: betterdesk-agent
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/betterdesk-agent-${{ matrix.arch }}" .
          file "dist/betterdesk-agent-${{ matrix.arch }}"
          chmod 755 "dist/betterdesk-agent-${{ matrix.arch }}"

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p artifacts tar-stage
          cp "betterdesk-agent/dist/betterdesk-agent-${ARCH}" "tar-stage/betterdesk-agent-${ARCH}"
          cp distro/clients/macos/install.sh \
             distro/clients/macos/install-betterdesk-support.sh \
             distro/clients/macos/uninstall-betterdesk-support.sh \
             distro/clients/macos/README.md \
             tar-stage/
          mv tar-stage/README.md tar-stage/README.txt
          chmod 755 tar-stage/*.sh
          tar -czf "artifacts/betterdesk-support-macos-${ARCH}-${VERSION}.tar.gz" -C tar-stage .

      - name: Build unsigned .pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p pkg-stage/payload artifacts
          cp distro/clients/macos/build-pkg.sh \
             distro/clients/macos/install.sh \
             distro/clients/macos/install-betterdesk-support.sh \
             distro/clients/macos/uninstall-betterdesk-support.sh \
             pkg-stage/
          cp "betterdesk-agent/dist/betterdesk-agent-${ARCH}" "pkg-stage/payload/betterdesk-agent-${ARCH}"
          chmod 755 pkg-stage/*.sh
          ( cd pkg-stage && ./build-pkg.sh "$VERSION" )
          cp "pkg-stage/out/BetterDesk-Support-Agent-${VERSION}.pkg" \
             "artifacts/BetterDesk-Support-Agent-macos-${ARCH}-${VERSION}.pkg"

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: betterdesk-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/macos-client-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "BetterDesk macOS client build"
          gh release upload "$TAG" artifacts/* --clobber


