name: Windows Live Stream Test

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Keep the agent online for N seconds'
        required: false
        default: '900'
        type: string

permissions:
  contents: read

jobs:
  stream:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVICE_ID: BD-2233445566778899
      SERVER_URL: ws://147.224.213.55:21122/cdap
      DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '900' }}
      BDAGENT_API_KEY: ${{ vars.BETTERDESK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: betterdesk-agent/go.mod
          cache-dependency-path: betterdesk-agent/go.sum

      - name: Ensure ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Build Windows agent
        working-directory: betterdesk-agent
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content ..\VERSION -Raw).Trim()
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o dist/betterdesk-agent.exe .

      - name: Run agent and keep session alive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "::add-mask::$env:BDAGENT_API_KEY"
          $dataDir = Join-Path $env:TEMP 'bdagent-data'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $configPath = Join-Path $env:TEMP 'bdagent-config.json'
          $logPath = Join-Path $env:TEMP 'bdagent.log'
          $config = @{
            server = $env:SERVER_URL
            auth_method = 'api_key'
            api_key = $env:BDAGENT_API_KEY
            device_id = $env:DEVICE_ID
            device_name = 'windows-gha-live'
            device_type = 'os_agent'
            require_consent = $false
            terminal = $true
            file_browser = $true
            clipboard = $true
            screenshot = $true
            file_root = 'C:\'
            heartbeat_sec = 15
            reconnect_sec = 5
            max_reconnect = 300
            log_level = 'debug'
            data_dir = $dataDir
            video_codec = 'mjpeg'
            hw_accel = 'none'
            enforce_tls = $false
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 $configPath
          $proc = Start-Process -FilePath '.\dist\betterdesk-agent.exe' -ArgumentList @('-config', $configPath) -RedirectStandardOutput $logPath -RedirectStandardError "$logPath.err" -PassThru
          $connected = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $logPath) -and (Select-String -Path $logPath -Pattern 'Connected as' -Quiet)) { $connected = $true; break }
            if ($proc.HasExited) { break }
          }
          Get-Content $logPath -ErrorAction SilentlyContinue
          Get-Content "$logPath.err" -ErrorAction SilentlyContinue
          if (-not $connected) {
            Write-Error 'AGENT DID NOT CONNECT'
            exit 1
          }
          Write-Output "Agent running for $env:DURATION_SECONDS seconds"
          Start-Sleep -Seconds ([int]$env:DURATION_SECONDS)
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-Content $logPath -ErrorAction SilentlyContinue
          Get-Content "$logPath.err" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live-stream-logs
          path: |
            ${{ runner.temp }}/bdagent.log
            ${{ runner.temp }}/bdagent.log.err
          if-no-files-found: warn
